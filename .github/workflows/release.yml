name: Release

# Publishes a signed F-Droid-flavour APK to a GitHub Release, which is what
# Obtainium tracks ("GitHub Releases" source, asset filter `*.apk`).
#
# The signing key lives in repository secrets (KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Keep it stable: Android refuses
# to update an installed app whose signature changed, so a new key means every
# user has to uninstall first.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for this release, e.g. 7.0.1-fork.1"
        required: true
      version_code:
        description: "versionCode (must increase every release)"
        required: true
      tunnel_tags:
        description: "Go build tags for the tunnel (tailscale = include tsnet, empty = lean build without Tailscale)"
        required: false
        default: "tailscale"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="${{ inputs.version_name }}"
            code="${{ inputs.version_code }}"
            tags="${{ inputs.tunnel_tags }}"
            echo "tag=v${name}" >> "$GITHUB_OUTPUT"
          else
            name="${GITHUB_REF_NAME#v}"
            code=$(git rev-list --count HEAD)
            tags="tailscale"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Building ${name} (${code}) tags=[${tags}]"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          sdkm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel/go.mod
          cache-dependency-path: tunnel/go.sum

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned APK"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          chmod 600 key.properties "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        run: |
          tags="${{ steps.v.outputs.tags }}"
          tag_flag=""
          [ -n "$tags" ] && tag_flag="-Ptunnel.tags=$tags"
          gomobile init
          ./gradlew -Ptunnel.source=local $tag_flag \
            -PversionName="${{ steps.v.outputs.name }}" \
            -PversionCode="${{ steps.v.outputs.code }}" \
            :app:assembleFdroidRelease

      - name: Collect artifacts
        run: |
          name="${{ steps.v.outputs.name }}"
          suffix=""
          [ -n "${{ steps.v.outputs.tags }}" ] && suffix="-${{ steps.v.outputs.tags }}"
          mkdir -p dist
          for apk in app/build/outputs/apk/fdroid/release/*.apk; do
            base=$(basename "$apk" .apk)
            abi=$(echo "$base" | sed -E 's/^app-[a-z]+-(arm64-v8a|armeabi-v7a|x86_64|x86|universal)-release$/\1/')
            cp "$apk" "dist/blockads-${name}${suffix}-${abi}.apk"
          done
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          name="${{ steps.v.outputs.name }}"
          notes="Signed fork build of BlockAds ${name}.

          * WireGuard + HTTPS filtering coexistence is available behind
            Settings → HTTPS filtering → Experimental (off by default).
          * Every asset in this release includes the experimental tsnet
            outbound (Tailscale). WireGuard + HTTPS coexistence is still opt-in.
          * Install with Obtainium: add this repository as a GitHub Releases
            source and filter assets on \`*.apk\`."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk --clobber
          else
            gh release create "$tag" dist/*.apk \
              --title "BlockAds fork ${name}" \
              --notes "$notes" \
              --latest
          fi
